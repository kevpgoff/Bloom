[runnable_presets]

Android="Android"

[preset.0]

name="Android"
platform="Android"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter=""
export_path="../build/android/bloom-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.kevpgoff.bloom"
package/name="Bloom"
package/signed=true
screen/immersive_mode=true
launcher_icons/main_192x192="res://art/app_icon/icon.svg"
launcher_icons/adaptive_foreground_432x432="res://art/app_icon/icon_foreground.svg"
launcher_icons/adaptive_background_432x432="res://art/app_icon/icon_background.svg"
launcher_icons/adaptive_monochrome_432x432="res://art/app_icon/icon_monochrome.svg"
command_line/extra_args=""
permissions/vibrate=true
permissions/internet=false
dotnet/android_use_linux_bionic=true
dotnet/include_debug_symbols=false
